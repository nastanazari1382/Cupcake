<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forside</title>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/fragments.css}">
</head>
<body>
<header th:replace="~{fragments/navbar :: navbar}"></header>

<main>
    <form>
        <label for="bottom">Bund</label>
        <select id="bottom" name="bottom">
            <option th:each="bottom : ${bottoms}"
                    th:value="${bottom.id}"
                    th:text="${bottom.name}">Bund</option>
        </select>
        <label for="topping">Topping</label>
        <select id="topping" name="topping">
            <option th:each="topping : ${toppings}"
                    th:value="${topping.id}"
                    th:text="${topping.name}">Topping</option>
        </select>
    </form>

</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
