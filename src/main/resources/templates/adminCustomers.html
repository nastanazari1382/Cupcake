<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kunder – Admin</title>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/fragments.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<header th:replace="~{fragments/navbar :: navbar}"></header>

<main class="admin-page">
    <h1>Kunder</h1>
    <nav th:replace="~{fragments/adminMenu :: adminMenu('customers')}"></nav>

    <p class="error" th:if="${error}" th:text="${error}"></p>
    <p th:if="${customers != null and #lists.isEmpty(customers)}">Der er ingen kunder endnu.</p>

    <section class="customer-card" th:each="entry : ${customers}">
        <div class="customer-head">
            <h2 th:text="${entry.customer.email}"></h2>
            <p class="balance">Saldo: <strong th:text="${#numbers.formatDecimal(entry.customer.balance, 1, 0)} + ' kr'"></strong></p>
        </div>

        <p class="muted" th:if="${#lists.isEmpty(entry.orders)}">Ingen ordrer endnu.</p>

        <table class="admin-table" th:unless="${#lists.isEmpty(entry.orders)}">
            <thead>
            <tr><th>Ordre</th><th>Dato</th><th>Pris</th><th>Status</th></tr>
            </thead>
            <tbody>
            <tr th:each="order : ${entry.orders}">
                <td class="order-nr" th:text="'#' + ${order.id}"></td>
                <td th:text="${order.orderDateText}"></td>
                <td th:text="${#numbers.formatDecimal(order.total, 1, 0)} + ' kr'"></td>
                <td>
                    <span class="badge badge-unpaid" th:if="${not order.paid}">Ikke betalt</span>
                    <span class="badge badge-waiting" th:if="${order.paid and not order.pickedUp}">Venter</span>
                    <span class="badge badge-done" th:if="${order.paid and order.pickedUp}">Afhentet</span>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
