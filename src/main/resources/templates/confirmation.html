<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bekræftelse</title>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/fragments.css}">
    <link rel="stylesheet" th:href="@{/css/confirmation.css}">
</head>
<body>
<header th:replace="~{fragments/navbar :: navbar}"></header>

<main>
    <div class="card confirmation">
        <div class="check">&#10003;</div>
        <h1>Tak for din bestilling!</h1>
        <p class="order-number" th:text="${'Ordre nr. #' + orderId}">Ordre nr. #1024</p>

        <table>
            <thead>
            <tr>
                <th>Cupcake</th>
                <th>Antal</th>
                <th>I alt</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="line : ${orderlines}">
                <td th:text="${line.bottom.name + ' + ' + line.topping.name}"></td>
                <td th:text="${line.quantity}"></td>
                <td th:text="${#numbers.formatDecimal(line.totalPrice, 1, 2, 'COMMA') + ' kr'}"></td>
            </tr>
            </tbody>
        </table>

        <div class="summary">
            <p><span>Betalt</span> <strong th:text="${#numbers.formatDecimal(total, 1, 2, 'COMMA') + ' kr'}"></strong></p>
            <p><span>Ny saldo</span> <strong th:text="${#numbers.formatDecimal(session.currentUser.balance, 1, 2, 'COMMA') + ' kr'}"></strong></p>
        </div>

        <a class="back-link" href="/">Tilbage til forsiden</a>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
