<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kunder – Admin</title>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/fragments.css}">
</head>
<body>
<header th:replace="~{fragments/navbar :: navbar}"></header>

<main>
    <nav th:replace="~{fragments/adminMenu :: adminMenu}"></nav>

    <h1>Alle kunder</h1>
    <p class="error" th:if="${error}" th:text="${error}"></p>
    <p th:if="${#lists.isEmpty(customers)}">Der er ingen kunder endnu.</p>

    <section th:each="entry : ${customers}">
        <h2 th:text="${entry.customer.email}"></h2>
        <p>Saldo: <span th:text="${#numbers.formatDecimal(entry.customer.balance, 1, 2)}"></span> kr</p>

        <p th:if="${#lists.isEmpty(entry.orders)}">Ingen ordrer endnu.</p>

        <table th:unless="${#lists.isEmpty(entry.orders)}">
            <thead>
            <tr><th>Ordre</th><th>Dato</th><th>Indhold</th><th>I alt</th><th>Betalt</th></tr>
            </thead>
            <tbody>
            <tr th:each="order : ${entry.orders}">
                <td th:text="'#' + ${order.id}"></td>
                <td th:text="${order.orderDateText}"></td>
                <td>
                    <div th:each="line : ${order.lines}"
                         th:text="${line.quantity} + ' x ' + ${line.bottom.name} + ' + ' + ${line.topping.name}"></div>
                </td>
                <td th:text="${#numbers.formatDecimal(order.total, 1, 2)} + ' kr'"></td>
                <td th:text="${order.paid} ? 'Ja' : 'Nej'"></td>
            </tr>
            </tbody>
        </table>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
